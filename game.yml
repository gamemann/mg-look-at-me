# This game's descriptor: what a server runs when it installs this repository's pack.
# Not yet in dot-server-deploy's content/ as published (2026-10-06).

content_id: gamemann/mg-look-at-me
version: 0.0.0
kind: pack

name: Look At Me
max_players: 24

scene: scenes/lm_server.tscn
client_scene: game/lm.tscn
module: game/lm_module.gd

# This game's maps are small documents the server sends each client, so a host fetches the
# map packs its server owner names BEFORE the game loads (into the server-only packs)
# rather than on a map change: nobody is admitted to a server playing only the built-in map.
metadata:
  maps_delivery: server
